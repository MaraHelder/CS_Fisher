name: halo_model

paths:
    # Add below the directory of the project.
    # Rest of the paths are relative but might need to be changed for specific cases.
    project: &projectpath /Users/cgeorgiou/PycharmProjects/CS_Fisher
    output:
        fisher_matrix: !join [*projectpath, output]
        figures: !join [*projectpath, figures]

cosmology:
    Omega_m: 0.315
    Omega_b: 0.049
    h: 0.674
    sigma8: 0.811
    n_s: 0.965
    w0: -1
    wa: 0

baryons:
    logT_AGN:

IA:
    A_IA: 1
    a1h: 0.000675
    a1:
    a2:
    ad:
    eta:

derivatives:
    validation: [Omega_m, sigma8]
    stencil_points: 5
    step_size:
        Omega_m: 0.01
        Omega_b:
        h:
        A_s:
        sigma8: 0.05
        n_s:
        w0: 0.07
        wa: 0.3
        logT_AGN:
        A_IA: 0.01
        delta_z: 0.02


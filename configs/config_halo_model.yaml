        bin_start: 20
        bin_end: 15001
        N_bins: 20
        ell_min: 100
        ell_max: 2000

forecast:
    fsky: 0.4
    e_rms: 0.26
    year: 1
    z_min: 0.1
    z_max: 4.
    N_z_values: 400

sampling_validation:
    Omega_m: [0.1, 0.9]
    Omega_b:
    h:
    A_s: [0.5, 5.]
    n_s:
    w0: [-3., 0.]

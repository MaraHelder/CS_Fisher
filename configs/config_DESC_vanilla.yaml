name: DESC_vanilla

paths:
    # Add below the directory of the project.
    # Rest of the paths are relative but might need to be changed for specific cases.
    project: &projectpath /Users/cgeorgiou/PycharmProjects/CS_Fisher
    output:
        fisher_matrix: !join [*projectpath, output]
        figures: !join [*projectpath, figures]

cosmology:
    Omega_m: 0.3388
    Omega_b: 0.04575
    h: 0.6714
    A_s: 1.9019e-9
    n_s: 0.9493
    w0: -1
    wa: 0

IA:
    A_IA: 1.0
    a1h:
    eta: 0.0

derivatives:
    validation: [w0, wa]
    stencil_points: 5
    step_size:
        Omega_m: 0.003
        Omega_b: 0.002
        h: 0.002
        A_s: 0.002
        n_s: 0.002
        w0: 0.002
        wa: 0.002
        A_IA: 0.002
        eta: 0.002
        delta_z: 0.002

ell_binning:
    cosmic_shear:
        bin_start: 20
        bin_end: 2000
        N_bins: 20
        ell_min: 20
        ell_max: 2000

forecast:
    fsky: 0.43
    e_rms: 0.26
    year: 1
    z_min: 0.1
    z_max: 4.
    N_z_values: 400

sampling_validation:
    Omega_m: [0.1, 0.9]
    Omega_b: [0.001, 0.12]
    h: [0.4, 1.1]
    A_s: [0.5, 5.]
    n_s: [0.7, 1.3]
    w0: [-3., 0.]
    wa: [-3, 3]
    A_IA: [0.5, 1.5]
    eta: [-1, 1]
    delta_z: yes
